<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rifa Solidaria</title>
<style>
:root{--bg:#fff8f4;--card:#fff;--text:#3c1f1f;--muted:#7b6262;--available:#fff;--reserved:#ffe7a8;--paid:#cdeed6;--border:#e7b5b5;--accent:#7d4242;--soft:#f4dddd}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;background:rgba(255,248,244,.98);padding:14px;border-bottom:1px solid #efdada}
h1{font-size:22px;margin:0 0 4px}.sub{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:var(--card);border:1px solid #efdada;border-radius:12px;padding:8px;text-align:center}.stat b{display:block;font-size:18px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:10px;padding:10px 12px;font-weight:700}
.btn{background:var(--accent);color:#fff}.btn2{background:var(--soft);color:#5b3030}
.search{margin-top:10px}input,select,textarea{width:100%;padding:12px 13px;border-radius:10px;border:1px solid #dcc2c2;font-size:16px;background:#fff;color:#321;font-family:inherit}
main{padding:14px}.legend{display:flex;gap:12px;flex-wrap:wrap;margin:4px 0 14px;font-size:13px}
.dot{width:12px;height:12px;border-radius:3px;border:1px solid #c99;display:inline-block;margin-right:5px;vertical-align:-1px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.num{min-height:84px;border:1.5px solid var(--border);border-radius:12px;background:var(--available);padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.num.reserved{background:var(--reserved)}.num.paid{background:var(--paid)}.num .n{font-weight:900;font-size:18px}
.num .buyer{font-size:11px;line-height:1.15;color:#5b4242;text-align:center;margin-top:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.num .pay{font-size:10px;margin-top:3px;color:#7a5a5a;font-weight:700}
.summary{margin-top:8px;font-size:12px;color:var(--muted)}footer{padding:18px 14px 30px;color:var(--muted);font-size:12px;text-align:center}
.modal{position:fixed;inset:0;z-index:30;background:rgba(44,25,25,.42);display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}
.sheet{width:100%;max-width:560px;background:#fff;border-radius:20px 20px 0 0;padding:18px;max-height:92vh;overflow:auto}.sheet h2{margin:0 0 12px;font-size:22px}
.field{margin-bottom:12px}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:#634}textarea{min-height:84px;resize:vertical}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions .full{grid-column:1/-1}.danger{background:#f7d9d9;color:#7b2626}.close{background:#eee1e1;color:#4d3131}.save{background:var(--accent);color:#fff}
@media(min-width:700px){.grid{grid-template-columns:repeat(10,1fr)}.modal{align-items:center}.sheet{border-radius:20px}}
</style>
</head>
<body>
<header>
<h1>Rifa Solidaria</h1><div class="sub">Control de boletas 001–150</div>
<div class="stats"><div class="stat"><span>Disponibles</span><b id="a">0</b></div><div class="stat"><span>Reservadas</span><b id="r">0</b></div><div class="stat"><span>Pagadas</span><b id="p">0</b></div></div>
<div class="search"><input id="search" type="search" placeholder="Buscar número, nombre o medio de pago..."></div>
<div class="controls"><button class="btn" id="backupBtn">Copiar respaldo</button><button class="btn2" id="resetBtn">Restaurar datos iniciales</button></div>
<div class="summary" id="summaryPay"></div>
</header>
<main>
<div class="legend"><span><i class="dot" style="background:#fff"></i>Disponible</span><span><i class="dot" style="background:#ffe7a8"></i>Reservada</span><span><i class="dot" style="background:#cdeed6"></i>Pagada</span></div>
<div id="grid" class="grid"></div>
</main>
<footer>Los datos quedan guardados dentro de la app en este dispositivo.</footer>

<div id="modal" class="modal"><div class="sheet">
<h2 id="modalTitle"></h2>
<div class="field"><label>Nombre del comprador</label><input id="buyerName" type="text" placeholder="Nombre"></div>
<div class="field"><label>Estado</label><select id="status"><option value="0">Disponible</option><option value="1">Reservada / pendiente</option><option value="2">Pagada</option></select></div>
<div class="field"><label>Medio de pago</label><select id="paymentMethod"><option value="">Sin definir</option><option>Nequi</option><option>Llave Bre-B</option><option>Bancolombia</option><option>Efectivo</option><option>Otro</option></select></div>
<div class="field"><label>Observación</label><textarea id="note" placeholder="Ej: pendiente comprobante, pagó completo..."></textarea></div>
<div class="actions"><button class="save" id="saveBtn">Guardar</button><button class="close" id="closeBtn">Cancelar</button><button class="danger full" id="clearBtn">Liberar número y borrar datos</button></div>
</div></div>

<script>
const KEY='rifa150_app_v1';
const INITIAL={"81": {"status": 1, "name": "Ana María", "payment": "", "note": "Pendiente"}, "5": {"status": 1, "name": "Ana María", "payment": "", "note": "Pendiente"}, "137": {"status": 1, "name": "Cristian Ocampo", "payment": "", "note": "Pendiente"}, "29": {"status": 1, "name": "Juan Rodríguez CT", "payment": "", "note": "Pendiente"}, "36": {"status": 1, "name": "Juan Rodríguez CT", "payment": "", "note": "Pendiente"}, "15": {"status": 1, "name": "Nayeslin Andres", "payment": "", "note": "Pendiente"}, "64": {"status": 1, "name": "Gabriela Juanita", "payment": "", "note": "Pendiente"}, "65": {"status": 2, "name": "Don José Palomino", "payment": "Nequi", "note": "Pago confirmado por Nequi"}, "19": {"status": 2, "name": "Sandra Palomino", "payment": "Nequi", "note": "Pago confirmado por Nequi"}, "31": {"status": 2, "name": "Sandra Palomino", "payment": "Nequi", "note": "Pago confirmado por Nequi"}, "88": {"status": 1, "name": "Jhon Salazar CT", "payment": "", "note": "Pendiente"}, "44": {"status": 1, "name": "Sofía Millan", "payment": "", "note": "Pendiente"}, "26": {"status": 1, "name": "Neitan Narvaez", "payment": "", "note": "Pendiente"}};
let data;
try{data=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(JSON.stringify(INITIAL));}catch(e){data=JSON.parse(JSON.stringify(INITIAL));}
if(!localStorage.getItem(KEY)) localStorage.setItem(KEY,JSON.stringify(data));
let current=null;
const grid=document.getElementById('grid'),modal=document.getElementById('modal'),buyerName=document.getElementById('buyerName'),statusSel=document.getElementById('status'),paymentMethod=document.getElementById('paymentMethod'),note=document.getElementById('note'),search=document.getElementById('search');
function fmt(n){return String(n).padStart(3,'0')} function getItem(i){return data[i]||{status:0,name:'',payment:'',note:''}} function label(s){return s===1?'Reservada':s===2?'Pagada':'Disponible'} function cls(s){return s===1?'reserved':s===2?'paid':''}
function saveAll(){localStorage.setItem(KEY,JSON.stringify(data));updateStats()}
function updateStats(){let a=0,r=0,p=0;const pc={Nequi:0,'Llave Bre-B':0,Bancolombia:0,Efectivo:0,Otro:0};for(let i=1;i<=150;i++){const x=getItem(i),s=x.status||0;if(s===0)a++;else if(s===1)r++;else p++;if(s===2&&x.payment&&pc[x.payment]!==undefined)pc[x.payment]++;}document.getElementById('a').textContent=a;document.getElementById('r').textContent=r;document.getElementById('p').textContent=p;const parts=Object.entries(pc).filter(x=>x[1]>0).map(x=>x[0]+': '+x[1]);document.getElementById('summaryPay').textContent=parts.length?'Pagadas por medio: '+parts.join(' • '):''}
function openModal(i){current=i;const x=getItem(i);document.getElementById('modalTitle').textContent='Boleta '+fmt(i);buyerName.value=x.name||'';statusSel.value=String(x.status||0);paymentMethod.value=x.payment||'';note.value=x.note||'';modal.classList.add('show')}
function closeModal(){modal.classList.remove('show');current=null}
function render(){grid.innerHTML='';const q=(search.value||'').trim().toLowerCase();for(let i=1;i<=150;i++){const x=getItem(i),number=fmt(i);const ok=number.includes(q)||String(i).includes(q)||(x.name||'').toLowerCase().includes(q)||(x.payment||'').toLowerCase().includes(q)||(x.note||'').toLowerCase().includes(q);if(q&&!ok)continue;const b=document.createElement('button');b.className='num '+cls(x.status||0);b.innerHTML='<div class="n">'+number+'</div><div class="buyer">'+((x.name||'').trim()?x.name:label(x.status||0))+'</div><div class="pay">'+(x.payment||'')+'</div>';b.onclick=()=>openModal(i);grid.appendChild(b)}updateStats()}
document.getElementById('saveBtn').onclick=()=>{if(current===null)return;data[current]={status:Number(statusSel.value),name:buyerName.value.trim(),payment:paymentMethod.value,note:note.value.trim()};saveAll();render();closeModal()};
document.getElementById('clearBtn').onclick=()=>{if(current===null)return;delete data[current];saveAll();render();closeModal()};
document.getElementById('closeBtn').onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};search.oninput=render;
document.getElementById('resetBtn').onclick=()=>{if(confirm('¿Restaurar los datos iniciales y borrar los cambios posteriores?')){data=JSON.parse(JSON.stringify(INITIAL));saveAll();render()}};
document.getElementById('backupBtn').onclick=async()=>{const txt=JSON.stringify(data,null,2);try{await navigator.clipboard.writeText(txt);alert('Respaldo copiado al portapapeles.')}catch(e){prompt('Copia este respaldo:',txt)}};
render();
</script>
</body></html>
